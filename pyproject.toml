[project]
name = "voidplayer"
version = "0.1.0"
description = "An open-source hacker-styled video player and typed FFmpeg wrapper."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
player = [
    "av>=13.0",
    "numpy>=2.0",
    "Pillow>=10.0",
    "PySide6>=6.8",
    "sounddevice>=0.5",
]

[project.scripts]
voidplayer = "ffmpeg_pywrapper.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
player = [
    "av>=13.0",
    "numpy>=2.0",
    "Pillow>=10.0",
    "PySide6>=6.8",
    "sounddevice>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffmpeg_pywrapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires ffmpeg and ffprobe executables on PATH",
]

[project]
name = "voidplayer"
version = "0.1.0"
description = "VoidPlayer: an anime-ready desktop video player powered by FFmpeg."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "av>=13.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "Pillow>=10.0",
    "PySide6>=6.8",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
player = [
    "av>=13.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "Pillow>=10.0",
    "PySide6>=6.8",
    "sounddevice>=0.5",
]
anime = [
    "cryptography>=42.0",
    "httpx>=0.27",
]

[project.scripts]
ffmpeg-pywrapper = "ffmpeg_pywrapper.__main__:main"
animeplayer = "ffmpeg_pywrapper.player.app:main"
voidplayer = "ffmpeg_pywrapper.player.app:main"

[dependency-groups]
dev = [
    "maturin>=1.7",
    "pytest>=8.0",
]
player = [
    "av>=13.0",
    "numpy>=2.0",
    "Pillow>=10.0",
    "PySide6>=6.8",
    "sounddevice>=0.5",
]
anime = [
    "cryptography>=42.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffmpeg_pywrapper"]
artifacts = [
    "src/ffmpeg_pywrapper/player/assets/*.svg",
    "src/ffmpeg_pywrapper/player/themes/*/*.toml",
    "src/ffmpeg_pywrapper/player/themes/*/*.qss",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires ffmpeg and ffprobe executables on PATH",
]

[project]
name = "ffmpeg-pywrapper"
version = "0.1.0"
description = "A small, typed Python wrapper around system FFmpeg and FFprobe."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
player = [
    "av>=13.0",
    "numpy>=2.0",
    "Pillow>=10.0",
    "PySide6>=6.8",
    "sounddevice>=0.5",
]

[project.scripts]
ffmpeg-pywrapper = "ffmpeg_pywrapper.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
player = [
    "av>=13.0",
    "numpy>=2.0",
    "Pillow>=10.0",
    "PySide6>=6.8",
    "sounddevice>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires ffmpeg and ffprobe executables on PATH",
]
